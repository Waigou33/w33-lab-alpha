name: FTS A/B harness

# 鐩殑锛氬湪鍚屼竴鍙版満鍣ㄣ€佸悓涓€娆′綔涓氶噷锛屽銆屽熀绾夸簩杩涘埗銆嶄笌銆屾墦浜嗚ˉ涓佺殑浜岃繘鍒躲€?# 浜ゆ浛璺戝悓涓€浠藉畼鏂瑰熀鍑嗭紙tools/benchmark/fts_large_bench.sh锛夛紝鎶婃満鍣ㄩ棿宸紓娑堟帀銆?# 涓嶄慨鏀广€佷笉鏇夸唬瀹樻柟 .github/workflows/vldb.yml锛涘畼鏂硅瘎娴嬩粛浠?vldb.yml 涓哄噯銆?#
# 棰勬湡鐢ㄦ硶锛氬湪 perf/fts-* 鍒嗘敮涓?workflow_dispatch 瑙﹀彂銆?# 鍒嗘敮鍐呭 = vldb_2026 + 鏈枃浠?+ .ci/perf.patch锛堢粺涓€ diff锛実it apply 鍙墦锛夈€?# 鑻?.ci/perf.patch 涓嶅瓨鍦ㄦ垨涓虹┖锛屽垯閫€鍖栦负 A/A 瀵圭収锛堢敤浜庢祴鍣０涓嬮檺锛夈€?
on:
  workflow_dispatch:
    inputs:
      patch_path:
        description: "浠撳簱鍐呰ˉ涓佹枃浠惰矾寰勶紙鐩稿浠撳簱鏍癸級"
        required: false
        default: ".ci/perf.patch"
      rounds:
        description: "A/B 杞暟锛堟瘡杞厛 base 鍚?patched锛?
        required: false
        default: "2"
      with_perf:
        description: "1=灏濊瘯鐢?perf 閲囨牱锛堜粎鍙栦俊鎭紝涓嶅奖鍝嶈鍒嗘寚鏍囷級"
        required: false
        default: "1"
  push:
    branches:
      - perf/fts-ab
    paths:
      - ".ci/perf.patch"
      - ".github/workflows/fts-ab.yml"

permissions:
  contents: read

concurrency:
  group: fts-ab-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_BASEDIR: ${{ github.workspace }}
  WITH_PERF: ${{ github.event.inputs.with_perf || '1' }}
  AB_ROUNDS: ${{ github.event.inputs.rounds || '2' }}
  AB_PATCH: ${{ github.event.inputs.patch_path || '.ci/perf.patch' }}

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: 鏄剧ず鐜
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h
          lscpu | head -20
          python3 -V
          gcc --version | head -1

      - name: 閲婃斁杩愯鍣ㄧ鐩?        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h

      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 瀹夎鏋勫缓渚濊禆
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils build-essential ccache cpio curl file git \
            libaio-dev libncurses-dev libtool-bin m4 make \
            python3 rpm rpm2cpio wget
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup show
          df -h

      - name: 鎭㈠绗笁鏂逛緷璧栫紦瀛?        uses: actions/cache@v4
        with:
          path: deps/3rd
          key: fts-probe-deps-${{ runner.os }}-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}

      - name: 鎭㈠ ccache 缂撳瓨
        uses: actions/cache@v4
        with:
          path: .ccache
          key: fts-ab-ccache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fts-ab-ccache-v1-${{ runner.os }}-

      - name: 缂栬瘧 baseline
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          ccache -M 3G
          ccache -z
          bash ./build.sh init
          bash ./build.sh release -DOB_USE_CCACHE=ON -DNEED_PARSER_CACHE=OFF
          cmake --build build_release --target seekdb -j4
          test -x build_release/src/observer/seekdb
          mkdir -p "$RUNNER_TEMP/bin"
          cp -f build_release/src/observer/seekdb "$RUNNER_TEMP/bin/seekdb_base"
          "$RUNNER_TEMP/bin/seekdb_base" -V
          ccache -s || true
          df -h

      - name: 搴旂敤琛ヤ竵骞跺閲忕紪璇?        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          PATCH="${AB_PATCH}"
          PATCH="${PATCH:-.ci/perf.patch}"
          echo "patch path: $PATCH"
          if [[ -s "$PATCH" ]]; then
            echo "==== patch head ===="
            head -40 "$PATCH"
            echo "==== patch stat ===="
            git apply --stat "$PATCH"
            echo "==== apply ===="
            git apply --whitespace=nowarn "$PATCH"
            git diff --stat | tail -40
            echo "A/B mode: BASE vs PATCHED"
            echo "PATCH_APPLIED=1" >> "$GITHUB_ENV"
          else
            echo "娌℃湁鍙敤鐨勮ˉ涓侊紙$PATCH 涓嶅瓨鍦ㄦ垨涓虹┖锛夆啋 A/A 瀵圭収妯″紡"
            echo "PATCH_APPLIED=0" >> "$GITHUB_ENV"
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          if [[ "$(git status --porcelain | wc -l)" -eq 0 ]]; then
            cp -f "$RUNNER_TEMP/bin/seekdb_base" "$RUNNER_TEMP/bin/seekdb_patched"
            echo "A/A: patched 澶嶇敤 base 浜岃繘鍒?
          else
            cmake --build build_release --target seekdb -j4
            cp -f build_release/src/observer/seekdb "$RUNNER_TEMP/bin/seekdb_patched"
          fi
          "$RUNNER_TEMP/bin/seekdb_patched" -V
          ccache -s || true
          df -h

      - name: 鍩哄噯 A/B 浜ゆ浛杩愯
        shell: bash
        run: |
          set -euo pipefail
          ROUNDS="${AB_ROUNDS}"
          ROUNDS="${ROUNDS:-2}"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          CLIENT="$(find "$GITHUB_WORKSPACE/deps/3rd" -maxdepth 8 -path '*/bin/obclient' -type f -print -quit)"
          if [[ -z "$CLIENT" ]]; then echo "鏈壘鍒?obclient"; exit 1; fi
          chmod +x "$CLIENT" || true
          export LD_LIBRARY_PATH="$(dirname "$CLIENT")/../lib:${LD_LIBRARY_PATH:-}"
          export MYSQL="$CLIENT -h127.0.0.1 -P2881 -uroot -N -s -A --default-character-set=utf8mb4"
          export MYSQL_VERBOSE="$CLIENT -h127.0.0.1 -P2881 -uroot -A --default-character-set=utf8mb4"
          echo "client: $CLIENT"

          wait_port_free() {
            for _ in $(seq 1 60); do
              if ! (echo > /dev/tcp/127.0.0.1/2881) 2>/dev/null; then return 0; fi
              sleep 1
            done
            return 1
          }

          stop_observer() {
            local dir="$1"
            if [[ -f "$dir/run/seekdb.pid" ]]; then
              local pid; pid="$(cat "$dir/run/seekdb.pid")"
              kill "$pid" 2>/dev/null || true
              for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
              kill -9 "$pid" 2>/dev/null || true
            fi
            wait_port_free || echo "璀﹀憡锛?881 绔彛浠嶈鍗犵敤"
          }

          fp() { # 璇箟鎸囩汗锛氬垎璇嶇粨鏋?+ 鍛戒腑鏁?+ 鍛戒腑 id 闆嗗悎鐨?md5 + 鐩稿叧鎬ф墦鍒嗙浉鍏虫帰閽?            local dest="$1"
            {
              echo "SET NAMES utf8mb4;"
              echo "SET group_concat_max_len = 100000000;"
              echo "SELECT 'tok_ik', MD5(tokenize('OceanBase鏄竴娆鹃潪甯哥ǔ瀹氱殑鏁版嵁搴擄紝鍏ㄦ枃绱㈠紩鐨勫垎璇嶅櫒鐑矾寰勪紭鍖栧寘鎷В鏋愬櫒瀹炰緥澶嶇敤銆佸仠鐢ㄨ瘝鍏ㄥ眬鍗曚緥銆佸唴瀛樻睜鍖栨暟鎹粨鏋勭瓑鎶€鏈紝鍦ㄥぇ閲忔枃妗ｇ储寮曞拰鏌ヨ鍦烘櫙涓嬪彲浠ユ樉钁楅檷浣?CPU 寮€閿€銆?, 'ik'));"
              echo "SELECT 'tok_beng', MD5(tokenize('The quick brown fox jumps over the lazy dog. Full-text search indexing requires efficient tokenization on the hot path.', 'beng'));"
              echo "SELECT 'hits_cn', COUNT(*) FROM fts_large_bench.docs WHERE MATCH(title, content) AGAINST('鍏ㄦ枃绱㈠紩 鍒嗚瘝鍣?);"
              echo "SELECT 'hits_beng', COUNT(*) FROM fts_large_bench.docs WHERE MATCH(title_en, content_en) AGAINST('database performance audit');"
              echo "SELECT 'hits_mixed', COUNT(*) FROM fts_large_bench.docs WHERE MATCH(title, content) AGAINST('OceanBase 绋冲畾 database');"
              echo "SELECT 'hits_limit', COUNT(*) FROM (SELECT id FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('鍊掓帓绱㈠紩 tokenizer') LIMIT 20) t;"
              echo "SELECT 'ids_cn_md5', MD5(GROUP_CONCAT(id ORDER BY id SEPARATOR ',')) FROM fts_large_bench.docs WHERE MATCH(title, content) AGAINST('鍏ㄦ枃绱㈠紩 鍒嗚瘝鍣?);"
              echo "SELECT 'ids_beng_md5', MD5(GROUP_CONCAT(id ORDER BY id SEPARATOR ',')) FROM fts_large_bench.docs WHERE MATCH(title_en, content_en) AGAINST('database performance audit');"
              echo "SELECT 'score_md5', MD5(GROUP_CONCAT(ROUND(MATCH(content) AGAINST('tokenizer'), 6) ORDER BY id SEPARATOR ',')) FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('tokenizer');"
              echo "SELECT 'score_pos_proj', COUNT(*) FROM (SELECT id, MATCH(content) AGAINST('tokenizer') AS s FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('tokenizer') LIMIT 50) t WHERE s > 0;"
              echo "SELECT 'gt_zero', COUNT(*) FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('tokenizer') > 0;"
              echo "SELECT 'gt_half', COUNT(*) FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('tokenizer') > 0.5;"
              echo "SELECT 'order_by_score_md5', MD5(GROUP_CONCAT(id ORDER BY id SEPARATOR ',')) FROM (SELECT id FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('tokenizer') ORDER BY MATCH(content) AGAINST('tokenizer') DESC LIMIT 20) t;"
              echo "SELECT 'boolean_mode', COUNT(*) FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('+tokenizer -index' IN BOOLEAN MODE);"
              echo "SELECT 'window_probe', COUNT(*) FROM (SELECT id, ROW_NUMBER() OVER (ORDER BY id) rn FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('tokenizer') LIMIT 20) t;"
              echo "SELECT 'having_probe', COUNT(*) FROM (SELECT id FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('tokenizer') GROUP BY id HAVING MAX(MATCH(content) AGAINST('tokenizer')) > 0.3) t;"
              echo "SELECT 'two_match', COUNT(*) FROM fts_large_bench.docs WHERE MATCH(title) AGAINST('鏁版嵁搴?) AND MATCH(content) AGAINST('tokenizer');"
            } | $MYSQL_VERBOSE > "$dest" 2>&1 || echo "FINGERPRINT_FAILED" >> "$dest"
            # 璁″垝褰㈡€侊細calc_relevance 鍩虹嚎涓庤ˉ涓佹湰搴斾笉鍚岋紙鍒濈増鏃犳椤癸級锛屽崟鐙惤鐩?            {
              echo "SET NAMES utf8mb4;"
              echo "EXPLAIN SELECT COUNT(*) FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('鍊掓帓绱㈠紩 tokenizer');"
              echo "EXPLAIN SELECT id, MATCH(content) AGAINST('tokenizer') AS s FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('tokenizer') LIMIT 5;"
            } | $MYSQL_VERBOSE > "${dest%.txt}-explain.txt" 2>&1 || true
          }

          run_one() { # $1=label $2=binary
            local label="$1" bin="$2"
            local work="$RUNNER_TEMP/fts-$label"
            local report="$OUT/report-$label.txt"
            rm -rf "$work"; mkdir -p "$work"
            cp -f "$bin" "$work/observer"; chmod +x "$work/observer"
            echo "==== [$label] start observer ===="
            ( cd "$work" && ./observer > observer.log 2>&1 ) &
            for _ in $(seq 1 120); do
              [[ -f "$work/run/seekdb.pid" ]] && break
              sleep 1
            done
            if [[ ! -f "$work/run/seekdb.pid" ]]; then
              echo "observer 鏈惎鍔?; tail -n 120 "$work/observer.log" || true; exit 1
            fi
            for _ in $(seq 1 90); do
              if $CLIENT -h127.0.0.1 -P2881 -uroot -A -e 'SELECT 1;' >/dev/null 2>&1; then break; fi
              sleep 2
            done
            $CLIENT -h127.0.0.1 -P2881 -uroot -A -e 'SELECT 1;' || { echo "SQL 涓嶅彲鐢?; exit 1; }

            echo "==== [$label] fingerprint (before bench) ===="
            fp "$OUT/fingerprint-before-$label.txt"

            echo "==== [$label] benchmark ===="
            LABEL="ab-${{ github.run_id }}-$label" \
            OUTPUT="$report" \
            SKIP_LOAD=0 ROWS=20000 BATCH=500 ROUNDS=3000 QUERY_ROUNDS=200 SAMPLES=3 WARMUP=30 \
              bash tools/benchmark/fts_large_bench.sh | tee "$OUT/log-$label.txt"
            python3 tools/benchmark/fts_large_bench_score.py "$report" | tee "$OUT/score-$label.txt"

            echo "==== [$label] fingerprint (after bench, same data) ===="
            # benchmark 姣忚疆閮戒細閲嶅缓 fts_large_bench 搴擄紝鎸囩汗鍦ㄥ熀鍑嗚窇瀹屽悗鍙栵紝淇濊瘉涓庢寚鏍囧悓婧?            fp "$OUT/fingerprint-$label.txt"

            stop_observer "$work"
            grep -c '' "$work/observer.log" > "$OUT/observer-linecount-$label.txt" || true
          }

          for r in $(seq 1 "$ROUNDS"); do
            echo "######## round $r/$ROUNDS ########"
            run_one "base-r$r" "$RUNNER_TEMP/bin/seekdb_base"
            run_one "patched-r$r" "$RUNNER_TEMP/bin/seekdb_patched"
          done

          echo "==== A/B 姹囨€?===="
          for f in "$OUT"/report-*.txt; do
            echo "-- $f"
            grep -E '^(build_|tokenize_.*avg_ms|query_.*avg_ms|query_.*hits|select1_avg)' "$f" || true
          done
          df -h

      - name: 璇箟鍥炲綊锛堝畼鏂?ai_funcs 鐢ㄤ緥锛屽敖鍔涙墽琛岋級
        if: always()
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/out"
          WORK="$RUNNER_TEMP/fts-semantics"
          rm -rf "$WORK"; mkdir -p "$WORK"
          cp -f "$RUNNER_TEMP/bin/seekdb_patched" "$WORK/observer" 2>/dev/null || { echo "no patched binary"; exit 0; }
          chmod +x "$WORK/observer"
          ( cd "$WORK" && ./observer > observer.log 2>&1 ) &
          for _ in $(seq 1 120); do [[ -f "$WORK/run/seekdb.pid" ]] && break; sleep 1; done
          CLIENT="$(find "$GITHUB_WORKSPACE/deps/3rd" -maxdepth 8 -path '*/bin/obclient' -type f -print -quit)"
          MT="$(find "$GITHUB_WORKSPACE/deps/3rd" -maxdepth 8 -path '*/bin/mysqltest' -type f -print -quit)"
          if [[ -z "$CLIENT" ]]; then echo "no obclient"; exit 0; fi
          chmod +x "$CLIENT" "$MT" 2>/dev/null
          export LD_LIBRARY_PATH="$(dirname "$CLIENT")/../lib:${LD_LIBRARY_PATH:-}"
          for _ in $(seq 1 90); do $CLIENT -h127.0.0.1 -P2881 -uroot -A -e 'SELECT 1;' >/dev/null 2>&1 && break; sleep 2; done
          $CLIENT -h127.0.0.1 -P2881 -uroot -A -e "CREATE DATABASE IF NOT EXISTS test;" || true
          if [[ -z "$MT" ]]; then
            echo "mysqltest 涓嶅湪 deps/3rd 涓紝璺宠繃瀹樻柟鐢ㄤ緥" | tee "$OUT/semantics-summary.txt"
          else
            MTR_TMP="$WORK/mtr_tmp"; mkdir -p "$MTR_TMP"
            cd "$GITHUB_WORKSPACE/tools/deploy" || exit 0
            export MYSQL_TMP_DIR="$MTR_TMP" OBMYSQL_MS0=127.0.0.1 OBMYSQL_PORT=2881 OBMYSQL_PWD=
            suite=mysql_test/test_suite/ai_funcs
            : > "$OUT/semantics-summary.txt"
            for t in load_file ai_split_document ik_custom_dict; do
              if [[ -f "$suite/t/$t.test" ]]; then
                if "$MT" --host=127.0.0.1 --port=2881 --user=root --database=test \
                     --test-file="$suite/t/$t.test" --result-file="$suite/r/$t.result" \
                     > "$OUT/mysqltest-$t.log" 2>&1; then
                  echo "$t: PASS" >> "$OUT/semantics-summary.txt"
                else
                  echo "$t: FAIL" >> "$OUT/semantics-summary.txt"
                fi
              else
                echo "$t: MISSING" >> "$OUT/semantics-summary.txt"
              fi
            done
            cat "$OUT/semantics-summary.txt"
          fi
          if [[ -f "$WORK/run/seekdb.pid" ]]; then kill "$(cat "$WORK/run/seekdb.pid")" 2>/dev/null; fi
          exit 0

      - name: perf 閲囨牱锛堝敖鍔涜€屼负锛屼笉褰卞搷璁″垎鎸囨爣锛?        if: always() && env.WITH_PERF == '1'
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/out"
          WORK="$RUNNER_TEMP/fts-perf"
          rm -rf "$WORK"; mkdir -p "$WORK"
          cp -f "$RUNNER_TEMP/bin/seekdb_patched" "$WORK/observer" || exit 0
          chmod +x "$WORK/observer"
          ( cd "$WORK" && ./observer > observer.log 2>&1 ) &
          for _ in $(seq 1 120); do [[ -f "$WORK/run/seekdb.pid" ]] && break; sleep 1; done
          PID="$(cat "$WORK/run/seekdb.pid" 2>/dev/null)"
          if [[ -z "$PID" ]]; then echo "observer 鏈惎鍔紝璺宠繃 perf"; exit 0; fi
          CLIENT="$(find "$GITHUB_WORKSPACE/deps/3rd" -maxdepth 8 -path '*/bin/obclient' -type f -print -quit)"
          chmod +x "$CLIENT" 2>/dev/null
          export LD_LIBRARY_PATH="$(dirname "$CLIENT")/../lib:${LD_LIBRARY_PATH:-}"
          for _ in $(seq 1 90); do $CLIENT -h127.0.0.1 -P2881 -uroot -A -e 'SELECT 1;' >/dev/null 2>&1 && break; sleep 2; done
          # 鐏屾暟骞跺缓绱㈠紩锛屼緵鏌ヨ閲囨牱
          $CLIENT -h127.0.0.1 -P2881 -uroot -A --default-character-set=utf8mb4 < tools/benchmark/fts_large_bench_setup.sql >/dev/null 2>&1
          python3 tools/benchmark/fts_large_bench_gen.py --rows 20000 --batch 500 | \
            $CLIENT -h127.0.0.1 -P2881 -uroot -A --default-character-set=utf8mb4 >/dev/null 2>&1
          $CLIENT -h127.0.0.1 -P2881 -uroot -A --default-character-set=utf8mb4 -e \
            "USE fts_large_bench; ALTER TABLE docs ADD FULLTEXT INDEX fti_all_ik(title, content) WITH PARSER ik;" >/dev/null 2>&1
          PERF="$(command -v perf || true)"
          if [[ -z "$PERF" ]]; then PERF="$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1)"; fi
          if [[ -z "$PERF" ]]; then
            echo "perf 涓嶅彲鐢紝璺宠繃閲囨牱" | tee "$OUT/perf-note.txt"
          else
            echo "perf: $PERF"
            sudo sysctl -w kernel.perf_event_paranoid=1 >/dev/null 2>&1 || true
            {
              echo "SET NAMES utf8mb4;"
              for _ in $(seq 1 800); do echo "SELECT tokenize('OceanBase鏄竴娆鹃潪甯哥ǔ瀹氱殑鏁版嵁搴擄紝鍏ㄦ枃绱㈠紩鐨勫垎璇嶅櫒鐑矾寰勪紭鍖栧寘鎷В鏋愬櫒瀹炰緥澶嶇敤銆佸仠鐢ㄨ瘝鍏ㄥ眬鍗曚緥銆佸唴瀛樻睜鍖栨暟鎹粨鏋勭瓑鎶€鏈紝鍦ㄥぇ閲忔枃妗ｇ储寮曞拰鏌ヨ鍦烘櫙涓嬪彲浠ユ樉钁楅檷浣?CPU 寮€閿€銆?, 'ik');"; done
              for _ in $(seq 1 800); do echo "SELECT tokenize('The quick brown fox jumps over the lazy dog. Full-text search indexing requires efficient tokenization on the hot path.', 'beng');"; done
              for _ in $(seq 1 60); do echo "SELECT COUNT(*) FROM fts_large_bench.docs WHERE MATCH(title, content) AGAINST('鍏ㄦ枃绱㈠紩 鍒嗚瘝鍣?);"; done
              for _ in $(seq 1 60); do echo "SELECT COUNT(*) FROM (SELECT id FROM fts_large_bench.docs WHERE MATCH(content) AGAINST('鍊掓帓绱㈠紩 tokenizer') LIMIT 20) t;"; done
            } > "$WORK/workload.sql"
            ( $CLIENT -h127.0.0.1 -P2881 -uroot -N -s -A --default-character-set=utf8mb4 < "$WORK/workload.sql" >/dev/null 2>&1 ) &
            WLPID=$!
            sudo "$PERF" record -F 399 -g -p "$PID" -o "$WORK/perf.data" -- sleep 45 >/dev/null 2>&1 || true
            wait $WLPID 2>/dev/null || true
            sudo "$PERF" report -i "$WORK/perf.data" --stdio --no-children --sort symbol 2>/dev/null | head -200 \
              > "$OUT/perf-self.txt" || true
            sudo "$PERF" report -i "$WORK/perf.data" --stdio --no-children --sort symbol 2>/dev/null \
              | grep -E 'ob_ik|ObIk|tokenize|Tokenize|fts|Fts|FTS|ob_text|ObText|ObFTParser' | head -80 \
              > "$OUT/perf-fts-filtered.txt" || true
            ls -la "$OUT"/perf-*.txt || true
          fi
          if [[ -n "$PID" ]]; then kill "$PID" 2>/dev/null; fi
          exit 0

      - name: 涓婁紶浜х墿
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fts-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out/
            ${{ runner.temp }}/bin/
          if-no-files-found: warn
          retention-days: 14
